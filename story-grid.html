<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light">
<title>經彩青春do｜高中版劇本網格</title>
<script src="./data/story.js" defer></script>
<style>
:root{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;color:#22324b;background:#f8fbff;font-size:17px}
*{box-sizing:border-box}body{margin:0}main{max-width:1380px;margin:auto;padding:24px clamp(16px,3vw,45px) 65px}h1{font-size:clamp(27px,3vw,42px);margin:0 0 5px}h2{margin:35px 0 15px;font-size:25px}p{line-height:1.85}a{color:#395c9a}button{font:inherit;cursor:pointer}.top{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between;align-items:center;border-bottom:1px solid #d8e1ee;padding-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 16px;border-radius:11px;border:1px solid #b7cce9;background:#fff;color:#395c9a;font-size:15px;font-weight:850}.btn:hover{background:#ebf2ff}.note{background:#eaf0fb;border-left:5px solid #5378b6;padding:12px 16px;border-radius:5px 12px 12px 5px;margin:21px 0}.summary{display:flex;gap:12px;flex-wrap:wrap}.summary span{background:#fff;padding:10px 15px;border:1px solid #dbe5f0;border-radius:13px}.summary strong{color:#5378b6;font-size:25px}.paths{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:16px 0}.path{background:#fff;border:1px solid #d5e2f2;border-radius:17px;padding:16px;min-width:0}.path h3{font-size:20px;color:#395c9a;margin:0 0 7px}.path p{font-size:15px;margin:5px 0}.link{display:inline-block;border-radius:6px;padding:3px 7px;background:#e7efff;font-weight:800}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{min-width:0;border-radius:16px;padding:20px;border:1px solid #d9e2ee;background:#fff}.card h3{margin:7px 0;font-size:21px}.pill{font-size:13px;border-radius:99px;padding:3px 9px;background:#dfe9f8;color:#395c9a;font-weight:900}.scene{white-space:pre-line;line-height:1.9;font-size:16px;color:#3e4e63}.choice{padding:11px 0;border-top:1px solid #e7edf5;line-height:1.8;font-size:15px}.choice b{color:#395c9a}.choice small{color:#798aa2;font-weight:800}.outcomes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.outcome{background:#fff;border:1px solid #dbe5f1;border-radius:15px;padding:16px;min-width:0}.outcome h3{margin:0 0 9px;font-size:20px}.outcome p{font-size:15px;line-height:1.82;margin:7px 0}.outcome .pass{color:#1d735b;background:#def3e8;border-radius:99px;padding:3px 7px;font-size:13px}.steps{padding-left:22px;margin:8px 0 12px;font-size:14px;color:#58708a}@media(max-width:950px){.outcomes{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.cards,.paths,.outcomes{grid-template-columns:1fr}.top{align-items:flex-start}}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>高中版劇本網格</h1><p style="margin:0;color:#61758f">經彩青春do｜青春同盟線上論壇</p></div><div class="actions"><a class="btn" href="./">返回遊戲</a><button id="export-choices" class="btn" type="button">下載選項 CSV</button><button id="export-outcomes" class="btn" type="button">下載結局 CSV</button></div></div>
<div class="note">本頁供教師核對劇本。文字以最新高中 Word 為依據；原始表格 BB2 與 BC2 的部分 END 代碼與選項順序交叉，系統已依 A／B／C 選項及回饋意義校正。成功通關路徑依原稿標示，不另創密碼。</div>
<div class="summary"><span><strong>13</strong> 個情境節點</span><span><strong>39</strong> 個選項</span><span><strong>27</strong> 個結局</span><span><strong>4</strong> 條通關路徑</span></div>
<h2>三回合分支總覽</h2><div class="paths" id="paths"></div>
<h2>全部情境與選項</h2><div class="cards" id="nodes"></div>
<h2>27 條結局與雙向回饋</h2><div class="outcomes" id="outcomes"></div>
</main>
<script>
window.addEventListener('DOMContentLoaded',()=>{
 const d=window.STORY_DATA;
 if(!d){document.querySelector('.note').textContent='劇本資料載入失敗。';return}
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const get=id=>d.nodes[id];
 document.getElementById('paths').innerHTML='ABC'.split('').map(a=>{
  const node=get('S0').choices[a],branch=get(node.next);
  return `<section class="path"><h3>${esc(a)}｜${esc(node.label)}</h3><p><span class="link">${esc(node.next)}</span> ${esc(branch.title)}</p>${'ABC'.split('').map(b=>{const p=branch.choices[b],node2=get(p.next);return `<p><span class="link">${esc(p.next)}</span> ${esc(node2.title)}</p>`}).join('')}</section>`;
 }).join('');
 document.getElementById('nodes').innerHTML=Object.entries(d.nodes).map(([id,node])=>`<section class="card"><span class="pill">${esc(id)}</span><h3>${esc(node.title)}</h3><p class="scene">${esc(node.scene)}</p>${'ABC'.split('').map(l=>{const q=node.choices[l];return `<div class="choice"><b>${l}｜${esc(q.label)}</b> ${esc(q.text)} <small>→ ${esc(q.next)}</small></div>`}).join('')}</section>`).join('');
 document.getElementById('outcomes').innerHTML=Object.entries(d.endings).map(([route,o])=>`<section class="outcome"><h3>${route} ${d.passRoutes.includes(route)?'<span class="pass">成功通關</span>':''}</h3><ol class="steps">${o.steps.map(s=>'<li>'+esc(s)+'</li>').join('')}</ol><p><b>做得好的地方：</b>${esc(o.positive)}</p><p><b>可以改進的地方：</b>${esc(o.improve)}</p></section>`).join('');
 const download=(filename,rows)=>{const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};
 document.getElementById('export-choices').addEventListener('click',()=>download('高中經彩do_情境選項.csv',[['節點','主題','情境','選項','行為標籤','選項內容','下一節點'],...Object.entries(d.nodes).flatMap(([id,n])=>'ABC'.split('').map(l=>[id,n.title,n.scene,l,n.choices[l].label,n.choices[l].text,n.choices[l].next]))]));
 document.getElementById('export-outcomes').addEventListener('click',()=>download('高中經彩do_結局回饋.csv',[['路徑','通關','第一個選擇','第二個選擇','第三個選擇','做得好的地方','可以改進的地方'],...Object.entries(d.endings).map(([id,o])=>[id,d.passRoutes.includes(id)?'是':'否',...o.steps,o.positive,o.improve])]));
});
</script>
</body></html>
